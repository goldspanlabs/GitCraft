[package]
name = "minigit-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "minigit_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
git2 = "0.19"
notify = "7"
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
tokio = { version = "1", features = ["rt", "sync"] }
uniffi = { version = "0.28", features = ["cli"] }

[dev-dependencies]
tempfile = "3"
