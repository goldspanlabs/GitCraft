name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make dmg
      - run: mv build/GitCraft.dmg GitCraft-${{ github.ref_name }}.dmg
      - uses: softprops/action-gh-release@v2
        with:
          files: GitCraft-${{ github.ref_name }}.dmg
