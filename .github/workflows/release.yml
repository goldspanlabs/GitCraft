name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A release only goes out if the tests pass on the oldest macOS the app supports.
  oldest-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Show tool versions
        run: sw_vers && xcodebuild -version && git --version
      - run: make test-swift

  macos:
    needs: oldest-macos
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make dmg
      - id: dmg
        run: |
          mv build/GitCraft.dmg GitCraft-${{ github.ref_name }}.dmg
          echo "sha256=$(shasum -a 256 GitCraft-${{ github.ref_name }}.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          files: GitCraft-${{ github.ref_name }}.dmg

  # Point the Homebrew cask in goldspanlabs/homebrew-tap at this release.
  # Needs a HOMEBREW_TAP_TOKEN secret with contents write access to the tap.
  # Skipped for pre-release tags such as v1.1.0-beta.1.
  homebrew:
    needs: macos
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Check for the tap token
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the Homebrew cask was not updated."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: goldspanlabs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - if: steps.token.outputs.present == 'true'
        env:
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ needs.macos.outputs.sha256 }}
        run: |
          version="${VERSION#v}"
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/${version}/" -e "s/@SHA256@/${SHA256}/" \
            app/packaging/homebrew/gitcraft.rb > tap/Casks/gitcraft.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/gitcraft.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date."
          else
            git commit -m "Update GitCraft to ${version}"
            git push
          fi
