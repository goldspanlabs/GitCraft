name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: make
      - run: ditto -c -k --sequesterRsrc --keepParent build/GitCraft.app GitCraft-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GitCraft-${{ github.ref_name }}
          path: GitCraft-${{ github.ref_name }}.zip
