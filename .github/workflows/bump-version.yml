name: Bump version

# Run from the Actions tab before cutting a release. Updates the version in
# rust-core/Cargo.toml, rust-core/Cargo.lock and macos-app/Info.plist, then
# commits and pushes to main. Create the GitHub release (tag vX.Y.Z) afterwards.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version without the v prefix, e.g. 1.3.0"
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.3.0 (got '$VERSION')"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          current=$(grep -m1 '^version = ' rust-core/Cargo.toml | cut -d'"' -f2)
          # Numeric comparison: the new version must be strictly greater.
          if ! python3 -c 'import sys; a=tuple(map(int, sys.argv[1].split("."))); b=tuple(map(int, sys.argv[2].split("."))); sys.exit(0 if b > a else 1)' "$current" "$VERSION"; then
            echo "::error::$VERSION must be greater than the current version $current"
            exit 1
          fi

      - name: Update version files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          version = os.environ["VERSION"]

          # Cargo.toml: the first `version = "..."` line is the [package] version.
          cargo = pathlib.Path("rust-core/Cargo.toml")
          text = cargo.read_text()
          text, n = re.subn(r'^version = "[^"]*"', f'version = "{version}"', text, count=1, flags=re.M)
          assert n == 1, "no version line in Cargo.toml"
          cargo.write_text(text)

          # Info.plist: marketing version, and bump the build number by one.
          plist = pathlib.Path("macos-app/Info.plist")
          text = plist.read_text()
          text, n1 = re.subn(
              r"(<key>CFBundleShortVersionString</key><string>)[^<]*(</string>)",
              lambda m: m.group(1) + version + m.group(2), text)
          def bump_build(m):
              return m.group(1) + str(int(m.group(2)) + 1) + m.group(3)
          text, n2 = re.subn(
              r"(<key>CFBundleVersion</key><string>)(\d+)(</string>)", bump_build, text)
          assert n1 == 1 and n2 == 1, "unexpected Info.plist layout"
          plist.write_text(text)
          PY

          cargo update --manifest-path rust-core/Cargo.toml -p gitcraft-core

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust-core/Cargo.toml rust-core/Cargo.lock macos-app/Info.plist
          if git diff --cached --quiet; then
            echo "::error::Nothing changed"
            exit 1
          fi
          git commit -m "Bump version to $VERSION"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN don't trigger push workflows, so run CI explicitly.
          gh workflow run ci.yml --ref main
