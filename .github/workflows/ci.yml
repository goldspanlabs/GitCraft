name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      test_class:
        description: >-
          Run only these UI test classes (comma-separated, e.g. StashUITests,BranchUITests,
          or StashUITests/testName). Leave empty to run the whole CI.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap Linux job that decides what the rest needs, so macOS runners only start when useful.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      macos: ${{ steps.plan.outputs.macos }}
      swift_tests: ${{ steps.plan.outputs.swift_tests }}
      ui_matrix: ${{ steps.plan.outputs.ui_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Plan jobs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_CLASS: ${{ inputs.test_class }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED="$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
            export CHANGED
            echo "Changed files:"; echo "$CHANGED"
          fi
          python3 scripts/ci_plan.py

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Cache Rust builds
        uses: actions/cache@v4
        with:
          path: rust-core/target
          key: ${{ runner.os }}-rust-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-
      - name: Check formatting
        run: cargo fmt --manifest-path rust-core/Cargo.toml --check
      - name: Run clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path rust-core/Cargo.toml

  build-app:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Keys include the sources so a new cache is saved when code changes; restore-keys let
      # that run start from the previous build instead of from scratch.
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: rust-core/target
          key: ${{ runner.os }}-app-rust-${{ hashFiles('rust-core/Cargo.lock', 'rust-core/Cargo.toml', 'rust-core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-app-rust-
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: macos-app/.build
          key: ${{ runner.os }}-app-swift-${{ hashFiles('macos-app/Package.swift', 'macos-app/Sources/**') }}
          restore-keys: |
            ${{ runner.os }}-app-swift-
      - name: Run Swift tests
        if: needs.changes.outputs.swift_tests == 'true'
        run: make test-swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build GitCraft.app
        run: make
      - name: Generate the UI test project
        run: xcodegen generate --spec project.yml --project .
        working-directory: macos-app/UITests
      - name: Build UI tests for testing
        run: |
          xcodebuild build-for-testing \
            -project macos-app/UITests/GitCraftUITests.xcodeproj \
            -scheme GitCraftUITests \
            -destination 'platform=macOS' \
            -derivedDataPath build/UITestsDerivedData
      - name: Package app and UI test bundle
        run: tar -czf build/ui-test-bundle.tar.gz build/GitCraft.app build/UITestsDerivedData/Build/Products
      - name: Upload app bundle for UI tests
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-bundle
          path: build/ui-test-bundle.tar.gz
          retention-days: 1

  ui-tests:
    needs: [changes, build-app]
    if: needs.changes.outputs.ui_matrix != '[]'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download app bundle
        uses: actions/download-artifact@v4
        with:
          name: ui-test-bundle
          path: build
      - name: Extract app and UI test project
        run: |
          tar -xzf build/ui-test-bundle.tar.gz
          codesign --force --deep --sign - build/GitCraft.app
      - name: Run UI tests (shard ${{ matrix.shard }})
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TEST_CLASSES: ${{ matrix.classes }}
          TEST_RUNNER_GITCRAFT_APP_PATH: ${{ github.workspace }}/build/GitCraft.app
        run: |
          # The classes for this shard are planned by scripts/ci_plan.py, which balances them
          # by test count and narrows the run to the touched classes on UI-test-only changes.
          ONLY_TESTING=()
          for cls in $TEST_CLASSES; do
            ONLY_TESTING+=("-only-testing:GitCraftUITests/$cls")
          done
          echo "Running shard $SHARD_INDEX: ${ONLY_TESTING[*]}"
          XCTESTRUN=(build/UITestsDerivedData/Build/Products/*.xctestrun)
          xcodebuild test-without-building \
            -xctestrun "${XCTESTRUN[0]}" \
            -destination 'platform=macOS' \
            -resultBundlePath "build/UITests-shard-${SHARD_INDEX}.xcresult" \
            "${ONLY_TESTING[@]}"
      - name: Upload the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-shard-${{ matrix.shard }}
          path: build/UITests-shard-${{ matrix.shard }}.xcresult
