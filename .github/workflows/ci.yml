name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust-core/Cargo.toml --check
      - name: Run clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Build GitCraft.app
        run: make
